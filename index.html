<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DHK — Mô phỏng nguyên tử 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg:#0a0a0a; --bg-2:#141414; --bg-3:#1c1c1c;
    --border:#262626; --border-hi:#3a3a3a;
    --orange:#ff6b1a; --orange-bright:#ff8c42; --orange-soft:#cc7744;
    --text:#e8e8e8; --text-dim:#777; --text-mute:#555;
    --danger:#d94444; --green:#3fbf5f; --blue:#3f8fdf; --yellow:#dfbf3f;
  }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh; overflow: hidden;
  }
  body { display:flex; flex-direction:column; touch-action:none;
    font-size:14px; -webkit-font-smoothing:antialiased; }

  header { display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; background:var(--bg);
    border-bottom:1px solid var(--border); z-index:10; flex-shrink:0; }
  .logo { font-size:22px; font-weight:800; letter-spacing:4px;
    cursor:pointer; color:var(--orange);
    text-shadow:0 0 12px rgba(255,107,26,0.5);
    transition:all 0.2s; user-select:none; }
  .logo:hover { color:var(--orange-bright); }
  .header-right { display:flex; align-items:center; gap:10px; }
  .lang-select {
    background:var(--bg-2); color:var(--text);
    border:1px solid var(--border); padding:7px 12px;
    border-radius:6px; cursor:pointer; font-size:13px;
    outline:none; transition:border 0.2s; font-family:inherit;
  }
  .lang-select:hover { border-color:var(--orange); }
  .lang-select option { background:var(--bg-2); }
  .menu-btn { background:var(--bg-2); border:1px solid var(--border);
    border-radius:6px; width:38px; height:38px;
    display:flex; flex-direction:column; justify-content:center;
    align-items:center; gap:4px; cursor:pointer; transition:all 0.2s; }
  .menu-btn:hover { border-color:var(--orange); background:rgba(255,107,26,0.08); }
  .menu-btn span { width:16px; height:1.5px; background:var(--text);
    border-radius:1px; transition:background 0.2s; }
  .menu-btn:hover span { background:var(--orange); }

  main { flex:1; display:flex; flex-direction:column;
    padding:16px 24px; gap:12px; overflow:hidden; min-height:0; }

  .search-wrap { display:flex; justify-content:center; flex-shrink:0; }
  .search-box { width:100%; max-width:720px; position:relative; }
  .search-box input {
    width:100%; background:var(--bg-2); border:1px solid var(--border);
    color:var(--text); padding:14px 48px 14px 18px;
    border-radius:8px; font-size:15px; outline:none;
    transition:all 0.2s; font-family:inherit;
  }
  .search-box input::placeholder { color:var(--text-mute); }
  .search-box input:focus {
    border-color:var(--orange); background:var(--bg-3);
    box-shadow:0 0 0 3px rgba(255,107,26,0.12);
  }
  .search-box .clear-btn {
    position:absolute; right:12px; top:50%;
    transform:translateY(-50%); background:none; border:none;
    color:var(--text-dim); font-size:20px; cursor:pointer;
    line-height:1; padding:4px 8px; border-radius:4px; display:none;
  }
  .search-box.has-value .clear-btn { display:block; }
  .clear-btn:hover { color:var(--orange); background:rgba(255,107,26,0.1); }

  .suggestions {
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--bg-3); border:1px solid var(--border-hi);
    border-radius:8px; overflow:hidden; z-index:20;
    display:none; max-height:300px; overflow-y:auto;
    box-shadow:0 8px 24px rgba(0,0,0,0.6);
  }
  .suggestions.show { display:block; }
  .sug-item {
    padding:10px 16px; cursor:pointer; font-size:13.5px;
    border-bottom:1px solid var(--border);
    transition:background 0.15s;
    display:flex; justify-content:space-between; align-items:center;
  }
  .sug-item:last-child { border-bottom:none; }
  .sug-item:hover { background:rgba(255,107,26,0.12); color:var(--orange-bright); }
  .sug-item .sug-formula { color:var(--text-dim);
    font-family:monospace; font-size:12.5px; }
  .sug-item .sug-z { color:var(--text-mute);
    font-family:monospace; font-size:11px; margin-right:8px; }

  .view-tabs { display:flex; gap:4px; justify-content:center;
    flex-wrap:wrap; flex-shrink:0; }
  .view-tab {
    background:transparent; border:1px solid var(--border);
    color:var(--text-dim); padding:7px 16px;
    border-radius:6px; font-size:12.5px;
    cursor:pointer; transition:all 0.15s;
    white-space:nowrap; font-family:inherit; letter-spacing:0.3px;
  }
  .view-tab:hover { border-color:var(--border-hi); color:var(--text); }
  .view-tab.active {
    background:rgba(255,107,26,0.12);
    color:var(--orange); border-color:var(--orange);
  }

  .canvas-wrap {
    flex:1; position:relative;
    border:1px solid var(--border); border-radius:12px;
    overflow:hidden; background:#050505;
    min-height:0; cursor:grab;
  }
  .canvas-wrap:active { cursor:grabbing; }
  #canvas3d { width:100%; height:100%; display:block; }

  .empty-state {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    gap:14px; pointer-events:none;
    transition:opacity 0.4s; padding:0 20px;
  }
  .empty-state.hide { opacity:0; }
  .empty-state .symbol { font-size:56px; font-weight:200;
    color:var(--border-hi); letter-spacing:6px;
    font-family:'Courier New', monospace; }
  .empty-state .msg { color:var(--text-mute); font-size:13.5px;
    text-align:center; max-width:420px; line-height:1.6; }
  .empty-state .examples { display:flex; gap:6px; flex-wrap:wrap;
    justify-content:center; margin-top:8px; pointer-events:auto; }
  .empty-state .ex-chip {
    background:transparent; border:1px solid var(--border);
    color:var(--text-dim); padding:5px 12px;
    border-radius:4px; font-size:12px; cursor:pointer;
    transition:all 0.15s; font-family:inherit;
  }
  .empty-state .ex-chip:hover { border-color:var(--orange); color:var(--orange); }

  .toast {
    position:absolute; bottom:20px; left:50%;
    transform:translateX(-50%) translateY(80px);
    background:var(--bg-3); border:1px solid var(--danger);
    color:var(--text); padding:10px 18px;
    border-radius:6px; font-size:13px;
    transition:transform 0.3s; pointer-events:none;
    z-index:5; max-width:90%;
    box-shadow:0 4px 16px rgba(0,0,0,0.5);
  }
  .toast.show { transform:translateX(-50%) translateY(0); }

  .hint {
    position:absolute; bottom:12px; left:12px;
    color:var(--text-mute); font-size:11.5px;
    background:rgba(0,0,0,0.7); padding:6px 10px;
    border-radius:4px; border:1px solid var(--border);
    pointer-events:none; transition:opacity 0.5s;
    font-family:'Courier New', monospace; letter-spacing:0.3px;
  }
  .hint.hide { opacity:0; }

  .info-panel {
    position:absolute; top:12px; right:12px;
    width:240px; background:rgba(20,20,20,0.96);
    border:1px solid var(--border-hi);
    border-radius:8px; padding:14px;
    transform:translateX(280px); transition:transform 0.3s;
    z-index:6; backdrop-filter:blur(8px);
  }
  .info-panel.show { transform:translateX(0); }
  .info-panel h4 {
    color:var(--orange); font-size:15px;
    margin-bottom:10px; display:flex;
    justify-content:space-between; align-items:center;
    font-weight:600; letter-spacing:1px;
  }
  .info-panel .close-info {
    background:none; border:none; color:var(--text-dim);
    cursor:pointer; font-size:16px; line-height:1;
    padding:2px 6px; border-radius:3px;
  }
  .info-panel .close-info:hover { color:var(--orange); }
  .info-panel .info-row {
    display:flex; justify-content:space-between;
    font-size:12.5px; padding:5px 0;
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .info-panel .info-row:last-child { border-bottom:none; }
  .info-panel .info-label { color:var(--text-dim); }
  .info-panel .info-value { color:var(--text);
    font-family:'Courier New', monospace; font-size:12px;
    text-align:right; }

  .toolbar {
    display:flex; gap:6px; justify-content:center;
    flex-wrap:wrap; flex-shrink:0;
  }
  .tool-btn {
    background:var(--bg-2); border:1px solid var(--border);
    color:var(--text-dim); padding:9px 18px;
    border-radius:6px; font-size:12.5px;
    cursor:pointer; transition:all 0.15s;
    font-family:inherit; letter-spacing:0.5px;
  }
  .tool-btn:hover { border-color:var(--border-hi);
    color:var(--text); background:var(--bg-3); }
  .tool-btn.active {
    background:rgba(255,107,26,0.15);
    color:var(--orange); border-color:var(--orange);
  }
  .tool-btn.highlight {
    background:rgba(255,107,26,0.12);
    color:var(--orange); border-color:var(--orange);
  }
  .tool-btn.highlight:hover {
    background:rgba(255,107,26,0.22);
    color:var(--orange-bright);
  }

  /* === MECHANISM PANEL === */
  .mech-panel {
    position:absolute; left:12px; top:12px;
    width:290px; max-height:calc(100% - 24px);
    background:rgba(15,15,15,0.96);
    border:1px solid var(--orange);
    border-radius:8px; padding:0;
    transform:translateX(-320px); transition:transform 0.3s;
    z-index:7; backdrop-filter:blur(10px);
    display:flex; flex-direction:column;
    box-shadow:0 0 30px rgba(255,107,26,0.2);
  }
  .mech-panel.show { transform:translateX(0); }
  .mech-header {
    padding:14px 16px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between;
    align-items:center; flex-shrink:0;
  }
  .mech-header h4 { color:var(--orange); font-size:14px;
    font-weight:600; letter-spacing:1px; }
  .mech-header .close-mech {
    background:none; border:none; color:var(--text-dim);
    cursor:pointer; font-size:18px; line-height:1;
    padding:2px 6px; border-radius:3px;
  }
  .mech-header .close-mech:hover { color:var(--orange); }
  .mech-body {
    padding:14px 16px; overflow-y:auto; flex:1;
    font-size:13px; line-height:1.6;
  }
  .mech-title {
    color:var(--text); font-size:15px; font-weight:600;
    margin-bottom:4px;
  }
  .mech-formula {
    color:var(--orange); font-family:'Courier New', monospace;
    font-size:14px; margin-bottom:14px;
    padding:8px 12px; background:rgba(255,107,26,0.08);
    border-radius:6px; border-left:3px solid var(--orange);
  }
  .mech-step {
    padding:10px 12px; margin-bottom:8px;
    background:rgba(255,255,255,0.03);
    border-left:2px solid var(--border-hi);
    border-radius:4px; cursor:pointer;
    transition:all 0.2s;
  }
  .mech-step:hover {
    background:rgba(255,107,26,0.08);
    border-left-color:var(--orange);
  }
  .mech-step.active {
    background:rgba(255,107,26,0.12);
    border-left-color:var(--orange);
  }
  .mech-step .step-num {
    color:var(--orange); font-family:'Courier New', monospace;
    font-size:11px; font-weight:700;
    margin-right:6px;
  }
  .mech-step .step-title {
    color:var(--text); font-weight:600;
    font-size:12.5px; margin-bottom:4px;
  }
  .mech-step .step-desc {
    color:var(--text-dim); font-size:12px;
    line-height:1.5;
  }
  .mech-controls {
    padding:10px 16px; border-top:1px solid var(--border);
    display:flex; gap:6px; justify-content:space-between;
    flex-shrink:0;
  }
  .mech-controls button {
    flex:1; background:var(--bg-2);
    border:1px solid var(--border); color:var(--text-dim);
    padding:8px; border-radius:5px;
    font-size:12px; cursor:pointer;
    transition:all 0.15s; font-family:inherit;
  }
  .mech-controls button:hover {
    border-color:var(--orange); color:var(--orange);
  }
  .mech-controls button:disabled {
    opacity:0.3; cursor:not-allowed;
  }
  .mech-progress {
    padding:0 16px 12px;
    display:flex; gap:3px;
  }
  .mech-progress .bar {
    flex:1; height:3px;
    background:var(--border);
    border-radius:2px;
    transition:background 0.3s;
  }
  .mech-progress .bar.done { background:var(--orange); }

  /* === SIDEBAR === */
  .sidebar {
    position:fixed; top:0; right:-340px;
    width:320px; height:100%;
    background:var(--bg-2); border-left:1px solid var(--border);
    padding:0; transition:right 0.3s ease;
    z-index:100; overflow-y:auto;
  }
  .sidebar.open { right:0; }
  .sidebar-header {
    display:flex; justify-content:space-between;
    align-items:center; padding:20px 24px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-header h3 {
    color:var(--text); font-size:13px;
    font-weight:600; letter-spacing:3px;
    text-transform:uppercase;
  }
  .sidebar-close {
    background:none; border:none; color:var(--text-dim);
    font-size:20px; cursor:pointer; line-height:1;
    padding:4px 8px; border-radius:4px;
  }
  .sidebar-close:hover { color:var(--orange); background:rgba(255,107,26,0.1); }
  .acc-item { border-bottom:1px solid var(--border); }
  .acc-header {
    display:flex; justify-content:space-between;
    align-items:center; padding:16px 24px;
    cursor:pointer; color:var(--text);
    font-size:13.5px; user-select:none;
    transition:background 0.15s;
  }
  .acc-header:hover { background:var(--bg-3); color:var(--orange); }
  .acc-header .arrow {
    color:var(--text-mute); font-size:10px;
    transition:transform 0.3s;
  }
  .acc-item.open .acc-header .arrow { transform:rotate(90deg); color:var(--orange); }
  .acc-body {
    max-height:0; overflow:hidden;
    transition:max-height 0.35s ease;
  }
  .acc-item.open .acc-body { max-height:2000px; }
  .acc-body-inner {
    padding:0 24px 16px 24px;
    color:var(--text-dim); font-size:13px;
    line-height:1.7;
  }
  .acc-body-inner p { margin-bottom:8px; }
  .acc-body-inner .key {
    color:var(--orange-soft);
    font-family:'Courier New', monospace; font-size:12px;
  }
  .ptable-grid {
    display:grid; grid-template-columns:repeat(6, 1fr);
    gap:4px; padding:4px 0;
  }
  .ptable-cell {
    background:var(--bg-3); border:1px solid var(--border);
    border-radius:4px; padding:6px 4px;
    text-align:center; cursor:pointer;
    transition:all 0.15s; font-size:11px;
  }
  .ptable-cell:hover {
    border-color:var(--orange);
    background:rgba(255,107,26,0.1);
    transform:scale(1.05);
  }
  .ptable-cell .sym {
    display:block; font-weight:700;
    color:var(--text); font-size:13px;
  }
  .ptable-cell .z {
    display:block; color:var(--text-mute);
    font-size:9px; font-family:monospace;
  }
  .overlay {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.7);
    opacity:0; pointer-events:none;
    transition:opacity 0.3s; z-index:99;
  }
  .overlay.open { opacity:1; pointer-events:auto; }

  @media (max-width: 640px) {
    header { padding:12px 16px; }
    .logo { font-size:18px; letter-spacing:3px; }
    .lang-select { font-size:12px; padding:6px 8px; }
    main { padding:12px; gap:10px; }
    .tool-btn { padding:8px 12px; font-size:11.5px; }
    .view-tab { padding:6px 10px; font-size:11px; }
    .sidebar { width:300px; right:-320px; }
    .info-panel { width:190px; padding:10px; }
    .info-panel .info-row { font-size:11.5px; }
    .hint { font-size:10px; padding:4px 8px; }
    .empty-state .symbol { font-size:40px; }
    .ptable-grid { grid-template-columns:repeat(5, 1fr); }
    .mech-panel { width:calc(100% - 24px); }
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="location.reload()">DHK</div>
  <div class="header-right">
    <select class="lang-select" id="langSelect" onchange="changeLang(this.value)"></select>
    <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <div class="search-wrap">
    <div class="search-box" id="searchBox">
      <input type="text" id="formulaInput" autocomplete="off">
      <button class="clear-btn" onclick="clearInput()" aria-label="Xóa">×</button>
      <div class="suggestions" id="suggestions"></div>
    </div>
  </div>

  <div class="view-tabs" id="viewTabs">
    <button class="view-tab active" data-view="ball" onclick="setView('ball')" data-i18n="view_ball">Ball 3D</button>
    <button class="view-tab" data-view="wire" onclick="setView('wire')" data-i18n="view_wire">Wireframe</button>
    <button class="view-tab" data-view="nucleus" onclick="setView('nucleus')" data-i18n="view_nucleus">Hạt nhân</button>
    <button class="view-tab" data-view="shell" onclick="setView('shell')" data-i18n="view_shell">Electron shell</button>
    <button class="view-tab" data-view="cloud" onclick="setView('cloud')" data-i18n="view_cloud">Đám mây e</button>
    <button class="view-tab" data-view="slice" onclick="setView('slice')" data-i18n="view_slice">Mặt cắt</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="canvas3d"></canvas>

    <div class="empty-state" id="emptyState">
      <div class="symbol">[  ]</div>
      <div class="msg" id="emptyMsg"></div>
      <div class="examples">
        <button class="ex-chip" onclick="quickSearch('H2O')">H2O</button>
        <button class="ex-chip" onclick="quickSearch('CH4')">CH4</button>
        <button class="ex-chip" onclick="quickSearch('C6H6')">C6H6</button>
        <button class="ex-chip" onclick="quickSearch('Fe2O3')">Fe2O3</button>
        <button class="ex-chip" onclick="quickSearch('CH4+O2')">CH4+O2</button>
      </div>
    </div>

    <div class="hint" id="hint"></div>
    <div class="toast" id="toast"></div>

    <div class="info-panel" id="infoPanel">
      <h4><span id="infoTitle">—</span>
        <button class="close-info" onclick="hideInfo()">×</button>
      </h4>
      <div id="infoBody"></div>
    </div>

    <!-- Mechanism panel -->
    <div class="mech-panel" id="mechPanel">
      <div class="mech-header">
        <h4 id="mechHeaderTitle">Cơ chế</h4>
        <button class="close-mech" onclick="closeMech()">×</button>
      </div>
      <div class="mech-body" id="mechBody"></div>
      <div class="mech-progress" id="mechProgress"></div>
      <div class="mech-controls">
        <button id="mechPrev" onclick="mechPrev()">◀ Trước</button>
        <button id="mechPlay" onclick="mechPlayPause()">Phát</button>
        <button id="mechNext" onclick="mechNext()">Sau ▶</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool-btn" id="btnRotate" onclick="toggleRotate()"></button>
    <button class="tool-btn" id="btnMech" onclick="toggleMechFromBtn()" style="display:none"></button>
    <button class="tool-btn" onclick="resetView()" data-i18n="btn_reset">Reset</button>
    <button class="tool-btn" onclick="slowGen()" data-i18n="btn_slowgen">SlowGen</button>
    <button class="tool-btn" onclick="screenshot()" data-i18n="btn_screenshot">Chụp ảnh</button>
  </div>
</main>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3 id="menuTitle">Menu</h3>
    <button class="sidebar-close" onclick="toggleMenu()">×</button>
  </div>
  <div class="acc-item">
    <div class="acc-header" onclick="toggleAcc(this)">
      <span data-i18n="menu_home">Trang chủ</span><span class="arrow">▶</span>
    </div>
    <div class="acc-body"><div class="acc-body-inner">
      <p data-i18n="menu_home_desc">Mô phỏng nguyên tử và phân tử 3D.</p>
      <p style="cursor:pointer;color:var(--orange-soft)" onclick="goHome()" data-i18n="menu_home_back">→ Về trang chủ</p>
    </div></div>
  </div>
  <div class="acc-item">
    <div class="acc-header" onclick="toggleAcc(this)">
      <span data-i18n="menu_guide">Hướng dẫn</span><span class="arrow">▶</span>
    </div>
    <div class="acc-body"><div class="acc-body-inner" id="guideBody"></div></div>
  </div>
  <div class="acc-item">
    <div class="acc-header" onclick="toggleAcc(this)">
      <span data-i18n="menu_periodic">Bảng tuần hoàn</span><span class="arrow">▶</span>
    </div>
    <div class="acc-body"><div class="acc-body-inner">
      <p style="font-size:12px;color:var(--text-mute);margin-bottom:8px" data-i18n="periodic_hint">Nhấn vào nguyên tố để xem</p>
      <div class="ptable-grid" id="ptableGrid"></div>
    </div></div>
  </div>
  <div class="acc-item">
    <div class="acc-header" onclick="toggleAcc(this)">
      <span data-i18n="menu_contact">Liên hệ</span><span class="arrow">▶</span>
    </div>

/* ============================================================
   PARSER
============================================================ */
function parseFormula(formula) {
  formula = formula.replace(/\s+/g, '');
  if (formula.includes('+')) {
    const parts = formula.split('+').filter(p => p.length > 0);
    const groups = [];
    for (const p of parts) {
      const parsed = parseSingleMolecule(p);
      if (!parsed) return null;
      groups.push(parsed);
    }
    return { type:'reaction', groups, formula };
  }
  const isIon = formula.endsWith('+') || formula.endsWith('-');
  const clean = formula.replace(/[+-]$/, '');
  const parsed = parseSingleMolecule(clean);
  if (!parsed) return null;
  parsed.ion = isIon ? (formula.endsWith('+') ? '+' : '-') : null;
  return { type:'molecule', ...parsed, formula };
}

function parseSingleMolecule(str) {
  const atoms = [];
  function process(s, mult = 1) {
    let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (ch === '(') {
        let depth = 1, j = i + 1;
        while (j < s.length && depth > 0) {
          if (s[j] === '(') depth++;
          else if (s[j] === ')') depth--;
          j++;
        }
        const inside = s.substring(i + 1, j - 1);
        let numStr = '';
        while (j < s.length && /\d/.test(s[j])) { numStr += s[j]; j++; }
        process(inside, mult * (numStr ? parseInt(numStr) : 1));
        i = j; continue;
      }
      if (/[A-Z]/.test(ch)) {
        let sym = ch;
        if (i + 1 < s.length && /[a-z]/.test(s[i + 1])) { sym += s[i + 1]; i++; }
        let numStr = '';
        while (i + 1 < s.length && /\d/.test(s[i + 1])) { numStr += s[i + 1]; i++; }
        const cnt = (numStr ? parseInt(numStr) : 1) * mult;
        for (let k = 0; k < cnt; k++) atoms.push(sym);
        i++; continue;
      }
      i++;
    }
  }
  process(str);
  if (atoms.length === 0) return null;
  for (const a of atoms) if (!ELEMENTS[a]) return null;
  return { atoms };
}

function findSubstance(input) {
  const raw = input.trim();
  if (!raw) return null;
  const norm = normalize(raw);
  if (SUBSTANCES[norm]) return SUBSTANCES[norm];
  // Giữ nguyên nếu là phản ứng có +
  if (raw.includes('+')) {
    return raw.replace(/\s+/g,'');
  }
  if (ELEMENTS[raw]) return raw;
  if (raw.length <= 2) {
    const cap = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
    if (ELEMENTS[cap]) return cap;
  }
  let c = raw.replace(/\s+/g, '');
  if (/^[a-z]/.test(c)) c = c.replace(/([a-z])([A-Z]?)/g, (m,a,b) => a.toUpperCase()+b);
  c = c.replace(/[^A-Za-z0-9+\-()]/g, '');
  return c || null;
}

  mesh.userData.symbol = sym;
  mesh.userData.type = 'atom';
  return mesh;
}
function createWireAtom(sym, r) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(r, 16, 16),
    new THREE.MeshBasicMaterial({ color:ELEMENTS[sym].color, wireframe:true, transparent:true, opacity:0.75 })
  );
  mesh.userData.symbol = sym;
  mesh.userData.type = 'atom';
  return mesh;
}
function createBondMesh(p1, p2, radius = 0.07, color = 0x666666) {
  const s = new THREE.Vector3(...p1), e = new THREE.Vector3(...p2);
  const d = s.distanceTo(e);
  const cyl = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, d, 12),
    new THREE.MeshPhongMaterial({ color, emissive:0x111111, shininess:80 })
  );
  cyl.position.copy(s.clone().add(e).multiplyScalar(0.5));
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), e.clone().sub(s).normalize());
  return cyl;
}
function buildNucleus(sym, center, scale = 1) {
  const el = ELEMENTS[sym];
  const grp = new THREE.Group();
  grp.position.set(...center);
  const total = el.Z + el.N;
  const disp = Math.min(total, 60);
  const nr = 0.075 * scale;
  const cr = 0.15 + Math.cbrt(total) * 0.07 * scale;
  for (let i = 0; i < disp; i++) {
    const isP = i < Math.min(el.Z, disp);
    const color = isP ? 0xff3333 : 0x3399ff;
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(nr, 12, 12),
      new THREE.MeshPhongMaterial({ color, emissive:color, emissiveIntensity:0.55, shininess:100 })
    );
    const phi = Math.acos(1 - 2*(i+0.5)/disp);
    const theta = Math.PI * (1+Math.sqrt(5)) * i;
    m.position.set(cr*Math.sin(phi)*Math.cos(theta), cr*Math.cos(phi), cr*Math.sin(phi)*Math.sin(theta));
    m.userData.symbol = sym;
    m.userData.type = 'nucleon';
    grp.add(m);
  }
  return grp;
}
function buildElectronShells(sym, center, scale = 1) {
  const el = ELEMENTS[sym];
  const grp = new THREE.Group();
  grp.position.set(...center);
  el.shells.forEach((eCount, si) => {
    const r = (0.35 + si*0.32)*scale;
    const orbit = new THREE.Mesh(
      new THREE.TorusGeometry(r, 0.008, 8, 64),
      new THREE.MeshBasicMaterial({ color:0xff6b1a, transparent:true, opacity:0.35 })
    );
    orbit.rotation.x = Math.PI/2;
    orbit.rotation.z = si*0.4;
    grp.add(orbit);
    const disp = Math.min(eCount, 8);
    for (let i = 0; i < disp; i++) {
      const e = new THREE.Mesh(
        new THREE.SphereGeometry(0.055*scale, 12, 12),
        new THREE.MeshPhongMaterial({ color:0x00d4ff, emissive:0x00d4ff, emissiveIntensity:1.2, shininess:100 })
      );
      const a = (i/disp)*Math.PI*2;
      e.position.set(Math.cos(a)*r, Math.sin(a)*r*(si%2===0?1:-1)*0.3, Math.sin(a)*r);
      e.userData.symbol = sym;
      e.userData.type = 'electron';
      e.userData.orbitR = r;
      e.userData.orbitAngle = a;
      e.userData.orbitSpeed = 0.015 + si*0.005;
      e.userData.orbitTilt = si*0.4;
      grp.add(e);
    }
  });
  return grp;
}
function buildElectronCloud(sym, center, scale = 1) {
  const el = ELEMENTS[sym];
  const grp = new THREE.Group();
  grp.position.set(...center);
  el.shells.forEach((eCount, si) => {
    const r = (0.35 + si*0.32)*scale;
    const cnt = 30 + eCount*12;
    for (let i = 0; i < cnt; i++) {
      const phi = Math.acos(1-2*Math.random());
      const theta = Math.random()*Math.PI*2;
      const rr = r*(0.85+Math.random()*0.3);
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.025*scale, 6, 6),
        new THREE.MeshBasicMaterial({ color:0x00d4ff, transparent:true, opacity:0.5 })
      );
      m.position.set(rr*Math.sin(phi)*Math.cos(theta), rr*Math.cos(phi), rr*Math.sin(phi)*Math.sin(theta));
      m.userData.cloudBase = m.position.clone();
      m.userData.cloudPhase = Math.random()*Math.PI*2;
      grp.add(m);
    }
  });
  return grp;
}

/* ============================================================
   LAYOUT
============================================================ */
function layoutSmart(atoms) {
  const n = atoms.length;
  const positions = [];
  const counts = {};
  atoms.forEach(a => counts[a] = (counts[a]||0)+1);
  if (n === 1) return [[0,0,0]];
  if (n === 2) return [[-0.9,0,0],[0.9,0,0]];
  if (n === 3) {
    if (counts['C']===1 && (counts['O']===2 || counts['S']===2)) {
      return [[-1.3,0,0],[0,0,0],[1.3,0,0]];
    }
    const big = atoms.findIndex(a => a !== 'H');
    const others = atoms.map((a,i)=>i).filter(i=>i!==big);
    positions[big] = [0,0.35,0];
    positions[others[0]] = [-1.05,-0.55,0];
    positions[others[1]] = [1.05,-0.55,0];
    return positions;
  }
  if (n === 4) {
    let center = atoms.findIndex(a => a !== 'H');
    if (center === -1) center = 0;
    const r = 1.4;
    const tet = [[0,r,0],[0,-r/3,r*0.943],[r*0.816,-r/3,-r*0.471],[-r*0.816,-r/3,-r*0.471]];
    positions[center] = [0,0,0];
    const others = [];
    for (let i = 0; i < 4; i++) if (i !== center) others.push(i);
    for (let i = 0; i < others.length; i++) positions[others[i]] = tet[i+1] || tet[0];
    return positions;
  }
  let centerIdx = 0, bestScore = -1;
  for (let i = 0; i < atoms.length; i++) {
    const a = atoms[i];
    const score = (counts[a]===1?10:0) + (ELEMENTS[a]?.Z || 0);
    if (score > bestScore) { bestScore = score; centerIdx = i; }
  }
  positions[centerIdx] = [0,0,0];
  const others = [];
  for (let i = 0; i < n; i++) if (i !== centerIdx) others.push(i);
  const r = 1.2 + others.length*0.12;
  for (let i = 0; i < others.length; i++) {
    const phi = Math.acos(1-2*(i+0.5)/others.length);
    const theta = Math.PI*(1+Math.sqrt(5))*i;
    positions[others[i]] = [r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta)];
  }
  return positions;
}

   RENDER
============================================================ */
function renderMolecule(parsed) {
  currentParsed = parsed;
  clearMolecule();
  atomMeshes.length = 0;

  if (parsed.type === 'reaction') {
    let ox = 0;
    for (const g of parsed.groups) {
      const w = buildGroupAt(g, ox);
      ox += w + 1.2;
    }
    moleculeGroup.position.x = -ox/2 + 0.6;
  } else {
    buildGroupAt(parsed, 0);
  }

  const box = new THREE.Box3().setFromObject(moleculeGroup);
  const size = box.getSize(new THREE.Vector3());
  currentBounds = Math.max(size.x, size.y, size.z);
  cameraSpherical.radius = Math.max(4, currentBounds*2.2);
  updateCameraFromSpherical();
  moleculeGroup.rotation.set(0,0,0);
}

function buildGroupAt(parsed, ox) {
  const positions = layoutSmart(parsed.atoms);
  const meshes = [];
  let maxR = 0;

  if (currentView === 'ball' || currentView === 'slice') {
    for (let i = 0; i < parsed.atoms.length; i++) {
      const sym = parsed.atoms[i];
      const r = atomRadius(sym);
      maxR = Math.max(maxR, r);
      const m = createAtomMesh(sym, r);
      m.position.set(positions[i][0]+ox, positions[i][1], positions[i][2]);
      m.userData.homePos = m.position.clone();
      moleculeGroup.add(m);
      meshes.push(m);
      atomMeshes.push(m);
    }
    if (meshes.length >= 2) {
      let cIdx = 0, best = -1;
      for (let i = 0; i < parsed.atoms.length; i++) {
        const a = parsed.atoms[i];
        const c = parsed.atoms.filter(x=>x===a).length;
        const s = (c===1?10:0) + (ELEMENTS[a]?.Z||0);
        if (s > best) { best = s; cIdx = i; }
      }
      const br = currentView === 'slice' ? 0.13 : 0.08;
      for (let i = 0; i < meshes.length; i++) {
        if (i === cIdx) continue;
        moleculeGroup.add(createBondMesh(
          [meshes[cIdx].position.x, meshes[cIdx].position.y, meshes[cIdx].position.z],
          [meshes[i].position.x, meshes[i].position.y, meshes[i].position.z],
          br
        ));
      }
    }
  }

  if (currentView === 'wire') {
    for (let i = 0; i < parsed.atoms.length; i++) {
      const sym = parsed.atoms[i];
      const r = atomRadius(sym);
      maxR = Math.max(maxR, r);
      const m = createWireAtom(sym, r);
      m.position.set(positions[i][0]+ox, positions[i][1], positions[i][2]);
      m.userData.homePos = m.position.clone();
      moleculeGroup.add(m);
      meshes.push(m);
      atomMeshes.push(m);
    }
    for (let i = 1; i < meshes.length; i++) {
      moleculeGroup.add(createBondMesh(
        [meshes[0].position.x, meshes[0].position.y, meshes[0].position.z],
        [meshes[i].position.x, meshes[i].position.y, meshes[i].position.z],
        0.05, 0xff6b1a
      ));
    }
  }

  if (currentView === 'nucleus') {
    for (let i = 0; i < parsed.atoms.length; i++) {
      const sym = parsed.atoms[i];
      const r = atomRadius(sym);
      maxR = Math.max(maxR, r);
      const cx = positions[i][0]+ox, cy = positions[i][1], cz = positions[i][2];
      const shell = new THREE.Mesh(
        new THREE.SphereGeometry(r, 20, 20),
        new THREE.MeshBasicMaterial({ color:ELEMENTS[sym].color, transparent:true, opacity:0.06, wireframe:true })
      );
      shell.position.set(cx, cy, cz);
      moleculeGroup.add(shell);
      const nuc = buildNucleus(sym, [cx,cy,cz], r/0.65);
      nuc.traverse(o => {
        if (o.userData.type === 'nucleon') {
          o.userData.homePos = o.position.clone().add(nuc.position);
          atomMeshes.push(o);
        }
      });
      moleculeGroup.add(nuc);
      if (i > 0) moleculeGroup.add(createBondMesh(
        [positions[0][0]+ox, positions[0][1], positions[0][2]],
        [cx, cy, cz], 0.04
      ));
    }
  }

  if (currentView === 'shell') {
    for (let i = 0; i < parsed.atoms.length; i++) {
      const sym = parsed.atoms[i];
      const r = atomRadius(sym);
      maxR = Math.max(maxR, r);
      const cx = positions[i][0]+ox, cy = positions[i][1], cz = positions[i][2];
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(r*0.3, 24, 24),
        new THREE.MeshPhongMaterial({ color:ELEMENTS[sym].color, emissive:ELEMENTS[sym].color, emissiveIntensity:0.6 })
      );
      core.position.set(cx, cy, cz);
      core.userData.symbol = sym;
      core.userData.type = 'atom';
      core.userData.homePos = core.position.clone();
      moleculeGroup.add(core);
      atomMeshes.push(core);
      const sh = buildElectronShells(sym, [cx,cy,cz], r/0.65);
      sh.traverse(o => { if (o.userData.type==='electron') o.userData.homePos = o.position.clone(); });
      moleculeGroup.add(sh);
    }
  }

  if (currentView === 'cloud') {
    for (let i = 0; i < parsed.atoms.length; i++) {
      const sym = parsed.atoms[i];
      const r = atomRadius(sym);
      maxR = Math.max(maxR, r);
      const cx = positions[i][0]+ox, cy = positions[i][1], cz = positions[i][2];
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(r*0.18, 16, 16),
        new THREE.MeshPhongMaterial({ color:ELEMENTS[sym].color, emissive:ELEMENTS[sym].color, emissiveIntensity:0.7 })
      );
      core.position.set(cx, cy, cz);
      core.userData.symbol = sym;
      core.userData.type = 'atom';
      core.userData.homePos = core.position.clone();
      moleculeGroup.add(core);
      atomMeshes.push(core);
      const cl = buildElectronCloud(sym, [cx,cy,cz], r/0.65);
      cl.traverse(o => { if (o.userData.cloudBase) o.userData.homePos = o.position.clone(); });
      moleculeGroup.add(cl);
    }
  }
  return maxR*2 + 0.5;
}

function clearMolecule() {
  scene.remove(moleculeGroup);
  moleculeGroup.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
      else o.material.dispose();
    }
  });
  moleculeGroup = new THREE.Group();
  scene.add(moleculeGroup);
}

/* ============================================================
   MECHANISM PANEL
============================================================ */
let mechData = null;
let mechStep = 0;
let mechTimer = null;
let mechPlaying = false;

function getMechanism(formula) {
  const clean = formula.replace(/\s+/g,'');
  // Kiểm tra reaction trước
  if (MECHANISMS[clean]) return MECHANISMS[clean];
  // Đảo chiều (O2+CH4 → CH4+O2)
  if (clean.includes('+')) {
    const parts = clean.split('+');
    if (parts.length === 2) {
      const rev = parts[1]+'+'+parts[0];
      if (MECHANISMS[rev]) return MECHANISMS[rev];
    }
  }
  // Kiểm tra formation
  if (FORMATION[clean]) return FORMATION[clean];
  return null;
}

function openMech(formula) {
  const data = getMechanism(formula);
  if (!data) {
    document.getElementById('mechBody').innerHTML = `<p style="color:var(--text-dim)">${t('mech_no_steps')}</p>`;
    document.getElementById('mechProgress').innerHTML = '';
    document.getElementById('mechPanel').classList.add('show');
    mechData = null;
    return;
  }
  mechData = data;
  mechStep = 0;
  document.getElementById('mechHeaderTitle').textContent = t('mech_header');
  document.getElementById('mechPanel').classList.add('show');
  renderMechStep();
}

function renderMechStep() {
  if (!mechData) return;
  const step = mechData.steps[mechStep];
  const lang = currentLang;
  const title = step.title[lang] || step.title.vi;
  const desc = step.desc[lang] || step.desc.vi;
  const mechTitle = mechData.title[lang] || mechData.title.vi;

  let html = `
    <div class="mech-title">${mechTitle}</div>
    <div class="mech-formula">${mechData.equation}</div>
  `;
  mechData.steps.forEach((s, i) => {
    const st = s.title[lang] || s.title.vi;
    const sd = s.desc[lang] || s.desc.vi;
    html += `
      <div class="mech-step ${i === mechStep ? 'active' : ''}" onclick="setMechStep(${i})">
        <div class="step-title"><span class="step-num">${String(i+1).padStart(2,'0')}</span>${st}</div>
        ${i === mechStep ? `<div class="step-desc">${sd}</div>` : ''}
      </div>
    `;
  });
  document.getElementById('mechBody').innerHTML = html;

  // Progress
  const bars = mechData.steps.map((_, i) =>
    `<div class="bar ${i <= mechStep ? 'done' : ''}"></div>`
  ).join('');
  document.getElementById('mechProgress').innerHTML = bars;

  // Buttons
  document.getElementById('mechPrev').disabled = mechStep === 0;
  document.getElementById('mechNext').disabled = mechStep === mechData.steps.length - 1;
  document.getElementById('mechPlay').textContent = mechPlaying ? t('mech_pause') : t('mech_play');
}

function setMechStep(i) {
  if (!mechData || i < 0 || i >= mechData.steps.length) return;
  mechStep = i;
  renderMechStep();
  // Animate: highlight atom tương ứng — chỉ hiệu ứng visual
  animateMechStep();
}

function animateMechStep() {
  // Visual: làm sáng nhẹ atom tương ứng — có thể mở rộng sau
  if (!moleculeGroup) return;
}

function mechPrev() { setMechStep(mechStep - 1); }
function mechNext() { setMechStep(mechStep + 1); }
function mechPlayPause() {
  if (!mechData) return;
  mechPlaying = !mechPlaying;
  if (mechPlaying) {
    mechTimer = setInterval(() => {
      if (mechStep >= mechData.steps.length - 1) {
        mechPlaying = false;
        clearInterval(mechTimer);
        renderMechStep();
      } else {
        mechNext();
      }
    }, 2800);
  } else {
    clearInterval(mechTimer);
  }
  renderMechStep();
}
function closeMech() {
  document.getElementById('mechPanel').classList.remove('show');
  if (mechTimer) clearInterval(mechTimer);
  mechPlaying = false;
}

function toggleMechFromBtn() {
  if (document.getElementById('mechPanel').classList.contains('show')) {
    closeMech();
  } else {
    openMech(currentFormula);
  }
}

/* ============================================================
   CAMERA
============================================================ */
let isDragging = false;
let prevMouse = { x:0, y:0 };
const cameraTarget = new THREE.Vector3(0,0,0);
const cameraSpherical = { theta:0, phi:Math.PI/2, radius:8 };
function updateCameraFromSpherical() {
  camera.position.x = cameraSpherical.radius * Math.sin(cameraSpherical.phi) * Math.sin(cameraSpherical.theta);
  camera.position.y = cameraSpherical.radius * Math.cos(cameraSpherical.phi);
  camera.position.z = cameraSpherical.radius * Math.sin(cameraSpherical.phi) * Math.cos(cameraSpherical.theta);
  camera.lookAt(cameraTarget);
}
updateCameraFromSpherical();

function onPointerDown(e) {
  if (e.target.closest('.info-panel') || e.target.closest('.mech-panel')) return;
  isDragging = true;
  prevMouse.x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
  prevMouse.y = e.clientY || (e.touches && e.touches[0].clientY) || 0;
}
function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
  const y = e.clientY || (e.touches && e.touches[0].clientY) || 0;
  cameraSpherical.theta -= (x - prevMouse.x) * 0.005;
  cameraSpherical.phi -= (y - prevMouse.y) * 0.005;
  cameraSpherical.phi = Math.max(0.1, Math.min(Math.PI-0.1, cameraSpherical.phi));
  prevMouse.x = x; prevMouse.y = y;
  updateCameraFromSpherical();
}
function onPointerUp() { isDragging = false; }
function onWheel(e) {
  e.preventDefault();
  cameraSpherical.radius *= (1 + Math.sign(e.deltaY) * 0.1);
  const minR = Math.max(1, currentBounds*0.5);
  const maxR = Math.max(20, currentBounds*6);
  cameraSpherical.radius = Math.max(minR, Math.min(maxR, cameraSpherical.radius));
  updateCameraFromSpherical();
}

let pinchStartDist = 0, pinchStartRadius = 8;
function getPinchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}
wrap.addEventListener('mousedown', onPointerDown);
wrap.addEventListener('mousemove', onPointerMove);
wrap.addEventListener('mouseup', onPointerUp);
wrap.addEventListener('mouseleave', onPointerUp);
wrap.addEventListener('wheel', onWheel, { passive:false });
wrap.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pinchStartDist = getPinchDist(e.touches);
    pinchStartRadius = cameraSpherical.radius;
  } else if (e.touches.length === 1) onPointerDown(e);
}, { passive:false });
wrap.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const d = getPinchDist(e.touches);
    cameraSpherical.radius = pinchStartRadius * (pinchStartDist / d);
    const minR = Math.max(1, currentBounds*0.5);
    const maxR = Math.max(20, currentBounds*6);
    cameraSpherical.radius = Math.max(minR, Math.min(maxR, cameraSpherical.radius));
    updateCameraFromSpherical();
  } else if (e.touches.length === 1 && isDragging) onPointerMove(e);
}, { passive:false });
wrap.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) onPointerUp();
});
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY - rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(atomMeshes, false);
  if (hits.length > 0 && hits[0].object.userData.symbol) showInfo(hits[0].object.userData.symbol);
  else hideInfo();
});

function handleSearch(input) {
  const raw = input.trim();
  if (!raw) return;
  hideSuggestions();
  const formula = findSubstance(raw);
  if (!formula) {
    showToast(t('notFound') + raw);
    return;
  }
  const parsed = parseFormula(formula);
  if (!parsed) {
    showToast(t('notFound') + raw);
    return;
  }
  currentFormula = formula.replace(/\s+/g,'');
  renderMolecule(parsed);
  document.getElementById('emptyState').classList.add('hide');
  const hint = document.getElementById('hint');
  hint.classList.remove('hide');
  setTimeout(() => hint.classList.add('hide'), 5000);
  cameraSpherical.theta = 0;
  cameraSpherical.phi = Math.PI/2;
  updateCameraFromSpherical();

  // Hiện nút cơ chế/phản ứng nếu có
  const btn = document.getElementById('btnMech');
  const mech = getMechanism(currentFormula);
  if (mech) {
    btn.style.display = '';
    btn.textContent = currentFormula.includes('+') ? t('btn_reaction') : t('btn_mech');
    btn.classList.add('highlight');
  } else {
    btn.style.display = 'none';
    btn.classList.remove('highlight');
  }
  closeMech();
}

  { display:'CO2', sub:'Cacbon dioxit' },
  { display:'NH3', sub:'Amoniac' },
  { display:'NaCl', sub:'Muối ăn' },
  { display:'C6H6', sub:'Benzen' },
  { display:'H2SO4', sub:'Axit sunfuric' },
  { display:'HCl', sub:'Axit clohidric' },
  { display:'NaOH', sub:'Xút' },
  { display:'CaCO3', sub:'Đá vôi' },
  { display:'Fe2O3', sub:'Oxit sắt / Gỉ sắt' },
  { display:'C6H12O6', sub:'Glucozo' },
  { display:'C2H5OH', sub:'Etanol' },
  { display:'CH4+O2', sub:'Đốt metan' },
  { display:'Fe+O2', sub:'Sắt gỉ' },
  { display:'HCl+NaOH', sub:'Trung hòa' },

];
const formulaInput = document.getElementById('formulaInput');

const suggestionsEl = document.getElementById('suggestions');

function showSuggestions(query) {
  const q = normalize(query);
  if (!q) { hideSuggestions(); return; }
  const matches = SUGGEST_LIST.filter(s =>
    normalize(s.display).includes(q) || normalize(s.sub).includes(q)
  ).slice(0, 8);
  if (matches.length === 0) { hideSuggestions(); return; }
  suggestionsEl.innerHTML = matches.map(m =>
    `<div class="sug-item" onclick="pickSuggestion('${m.display}')">
       <span>${m.sub}</span><span class="sug-formula">${m.display}</span>
     </div>`
  ).join('');
  suggestionsEl.classList.add('show');
}
function pickSuggestion(f) {
  formulaInput.value = f;
  searchBox.classList.add('has-value');
  hideSuggestions();
  handleSearch(f);
}
function hideSuggestions() { suggestionsEl.classList.remove('show'); }

/* ============================================================
   ANIMATION LOOP
============================================================ */
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.016;
  if (rotating) moleculeGroup.rotation.y += 0.005;
  if (slowGenActive) {
    let done = true;
    moleculeGroup.traverse(o => {
      if (o.userData && o.userData.homePos) {
        o.position.lerp(o.userData.homePos, 0.06);
        if (o.position.distanceTo(o.userData.homePos) > 0.02) done = false;
      }
    });
    if (done) slowGenActive = false;
  }
  moleculeGroup.traverse(o => {
    if (o.userData && o.userData.type === 'electron') {
      o.userData.orbitAngle += o.userData.orbitSpeed;
      const r = o.userData.orbitR, a = o.userData.orbitAngle, tilt = o.userData.orbitTilt;
      const x = Math.cos(a)*r, z = Math.sin(a)*r, y = Math.sin(a)*r*0.3;
      o.position.x = x*Math.cos(tilt) - z*Math.sin(tilt);
      o.position.z = x*Math.sin(tilt) + z*Math.cos(tilt);
      o.position.y = y;
    }
    if (o.userData && o.userData.cloudBase) {
      const b = o.userData.cloudBase, ph = o.userData.cloudPhase;
      o.position.x = b.x + Math.sin(time*2+ph)*0.04;
      o.position.y = b.y + Math.cos(time*1.7+ph)*0.04;
      o.position.z = b.z + Math.sin(time*2.3+ph)*0.04;
    }
  });
  renderer.render(scene, camera);
}
animate();

  // Mech button
  const mechBtn = document.getElementById('btnMech');
  if (mechBtn.style.display !== 'none' && currentFormula) {
    mechBtn.textContent = currentFormula.includes('+') ? t('btn_reaction') : t('btn_mech');
  }
  // View tabs
  document.querySelectorAll('.view-tab').forEach(tab => {
    const k = tab.dataset.i18n;
    if (k) tab.textContent = t(k);
  });
  // Toolbar — các nút có data-i18n
  document.querySelectorAll('.tool-btn[data-i18n]').forEach(btn => {
    btn.textContent = t(btn.dataset.i18n);
  });
  // Menu accordion headers
  document.querySelectorAll('.acc-header span[data-i18n]').forEach(s => {
    s.textContent = t(s.dataset.i18n);
  });
  document.querySelectorAll('.acc-body-inner p[data-i18n]').forEach(p => {
    p.textContent = t(p.dataset.i18n);
  });
  // Guide body — rebuild
  const guideBody = document.getElementById('guideBody');
  guideBody.innerHTML = `
    <p>${t('guide_1')}</p>
    <p><span class="key">H2O</span> · <span class="key">nước</span> · <span class="key">water</span></p>
    <p><span class="key">Fe2O3</span> · <span class="key">gỉ sắt</span></p>
    <p>${t('guide_2')}</p>
    <p style="color:var(--orange-soft)">${t('guide_3')}</p>
    <p style="color:var(--orange-soft)">${t('guide_4')}</p>
    <p style="margin-top:12px"><b style="color:var(--text)">${t('guide_views')}</b></p>
    <p>${t('view_ball')}</p>
    <p>${t('view_wire')}</p>
    <p>${t('view_nucleus')}</p>
    <p>${t('view_shell')}</p>
    <p>${t('view_cloud')}</p>
    <p>${t('view_slice')}</p>
  `;
  // Periodic table hint
  const pth = document.querySelector('.acc-body-inner p[data-i18n="periodic_hint"]');
  if (pth) pth.textContent = t('periodic_hint');
  // Info panel — nếu đang mở, refresh
  if (document.getElementById('infoPanel').classList.contains('show')) {
    const titleEl = document.getElementById('infoTitle');
    if (titleEl && ELEMENTS[titleEl.textContent]) showInfo(titleEl.textContent);
  }
  // Mech panel — nếu đang mở, refresh
  if (document.getElementById('mechPanel').classList.contains('show')) {
    document.getElementById('mechHeaderTitle').textContent = t('mech_header');
    if (mechData) renderMechStep();
    else document.getElementById('mechBody').innerHTML = `<p style="color:var(--text-dim)">${t('mech_no_steps')}</p>`;
  }
}

function changeLang(lang) {
  currentLang = lang;
  applyI18n();
  buildPeriodicTable(); // rebuild tooltips
}

/* ============================================================
   INIT
============================================================ */
populateLangSelect();
applyI18n();
buildPeriodicTable();
// Đảm bảo nút xoay ban đầu
document.getElementById('btnRotate').textContent = t('rotateOff');
</script>
</body>
</html>
